add_newline = false

format = """$directory$fill$git_branch$git_status $golang$rust$nodejs$bun$python$ruby$cmd_duration
$character"""

right_format = ""

[fill]
symbol = " "

[python]
symbol = "\ue235 "

[bun]
symbol = "\ue76f "

[git_branch]
symbol = "\uf113 "
format = "[$symbol$branch]($style) "

[git_status]
format = "[$all_status]($style)"

[character]
format = "$symbol"
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
vicmd_symbol = "[❯](bold yellow) "
